name: phoenix-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../services/api/migrations/versions:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  api:
    build:
      context: ../services/api
    environment:
      PHOENIX_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      API_AUTH_SECRET: ${API_AUTH_SECRET}
      PHOENIX_GATEWAY_TOKEN: ${PHOENIX_GATEWAY_TOKEN}
      PHOENIX_BIOMECHANICS_URL: http://biomechanics:8080/v1/preprocess
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  patient-web:
    build:
      context: ..
      dockerfile: apps/patient-web/Dockerfile
      args:
        VITE_PHOENIX_GATEWAY_TOKEN: ${PHOENIX_GATEWAY_TOKEN}
    ports:
      - "8080:80"
    depends_on:
      - api

  clinician-web:
    build:
      context: ..
      dockerfile: apps/clinician-web/Dockerfile
    ports:
      - "8081:80"
    depends_on:
      - api

  imu-gateway:
    build:
      context: ../services/imu-gateway
    environment:
      PYTHONUNBUFFERED: "1"
      PHOENIX_IMU_INGEST_URL: http://api:8000/api/v1/gateway/imu-packets
      PHOENIX_GATEWAY_TOKEN: ${PHOENIX_GATEWAY_TOKEN}
    depends_on:
      - api

  biomechanics:
    build:
      context: ../services/biomechanics
    ports:
      - "8010:8080"

  ai-orchestrator:
    build:
      context: ../services/ai-orchestrator
    ports:
      - "8011:8080"
    profiles: ["llm"]
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:0.12.3
    profiles: ["llm"]
    environment:
      OLLAMA_HOST: ${OLLAMA_HOST}
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

volumes:
  minio-data:
  ollama-data:
  postgres-data:
  redis-data:
