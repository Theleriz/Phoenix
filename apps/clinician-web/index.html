<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PHOENIX — врач</title>
    <style>
      body { background: #f5f8fc; color: #13243b; font: 17px/1.5 system-ui, sans-serif; margin: 0; }
      main { margin: 3rem auto; max-width: 52rem; padding: 0 1.25rem; }
      .card { background: #fff; border-radius: 1rem; box-shadow: 0 3px 18px #14243a1c; margin: 1rem 0; padding: 1.25rem; }
      .warning { color: #7a4d00; }
      dt { color: #536579; font-weight: 600; } dd { margin: 0 0 .9rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>PHOENIX</h1>
      <p>Локальный демонстрационный кабинет врача</p>
      <section class="card" id="content" aria-live="polite">Загружаем seed-данные…</section>
    </main>
    <script>
      fetch('/api/v1/demo').then(response => response.json()).then(data => {
        const replay = data.replay_session;
        document.querySelector('#content').innerHTML = `
          <h2>${data.patient.display_name}</h2>
          <dl>
            <dt>Организация</dt><dd>${data.organization.name}</dd>
            <dt>Врач</dt><dd>${data.clinician.display_name}</dd>
            <dt>Источник сессии</dt><dd>${replay.origin}; ${replay.frame_count} кадров</dd>
            <dt>Статус валидации</dt><dd>${replay.validation_status}</dd>
          </dl>
          <p class="warning">${data.safety_notice}</p>
        `;
      }).catch(() => {
        document.querySelector('#content').textContent = 'API недоступен. Проверьте docker compose logs api.';
      });
    </script>
  </body>
</html>
